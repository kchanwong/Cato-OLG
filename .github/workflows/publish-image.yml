name: Publish image

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Native ARM, so the image is built and tested on the architecture Batch
    # runs it on, without QEMU emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: 456703663739.dkr.ecr.us-east-1.amazonaws.com/backburner
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build and run sample jobs before anything reaches ECR, so a broken
      # image is never published.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: olg:test
      - run: test/smoke_image.sh olg:test
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::456703663739:role/backburner-olg-image-publisher
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
